apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-web
  template:
    metadata:
      labels:
        app: demo-web
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          env:
            - name: MENSAJE
              value: "Hola desde Argo CD - version 2"
            - name: COLOR
              value: "#FD79A8"
          command: ["/bin/sh", "-c"]
          args:
            - |
              cat > /usr/share/nginx/html/index.html <<EOF
              <!doctype html>
              <html>
              <head><meta charset="utf-8"><title>Demo Argo CD</title></head>
              <body style="margin:0;height:100vh;display:flex;align-items:center;justify-content:center;background:$COLOR;font-family:sans-serif;color:white;text-align:center">
              <div>
              <h1 style="font-size:64px">$MENSAJE</h1>
              </div>
              </body>
              </html>
              EOF
              exec nginx -g 'daemon off;'
          ports:
            - containerPort: 80
